name: trade-store

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
      POSTGRES_DB: ${POSTGRES_DB:-trade_store}
    volumes:
      - trade_store_data:/var/lib/postgresql/data
    networks:
      - trade_store
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade} -d ${POSTGRES_DB:-trade_store}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://trade:trade@db:5432/trade_store}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-UTC}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trade_store
    restart: "no"

  api:
    build: .
    environment: &app_env
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://trade:trade@db:5432/trade_store}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-UTC}
      EXPIRY_INTERVAL_SECONDS: ${EXPIRY_INTERVAL_SECONDS:-60}
      BULK_MAX_ITEMS: ${BULK_MAX_ITEMS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EXPIRY_HEARTBEAT_PATH: ${EXPIRY_HEARTBEAT_PATH:-/tmp/expiry-heartbeat}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - trade_store
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.expiry"]
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - trade_store
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import os, time; from pathlib import Path; p = Path(os.environ.get('EXPIRY_HEARTBEAT_PATH', '/tmp/expiry-heartbeat')); max_age = int(os.environ.get('EXPIRY_INTERVAL_SECONDS', '60')) * 2 + 15; assert p.exists() and time.time() - p.stat().st_mtime < max_age",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  trade_store:
    name: trade_store

volumes:
  trade_store_data:
    name: trade_store_data
